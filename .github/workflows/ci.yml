name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]     # 3.13 checks certificates strictly by default; a bug in the certificate script hid until it ran there
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install a local MQTT broker (for the integration tests)
        run: sudo apt-get update && sudo apt-get install -y mosquitto
      - name: Install the package
        run: pip install -e .[dev]
      - name: Tests
        run: pytest -q
