# A Mosquitto configuration with users and per-topic permissions, for the broker on the machine that runs the bridge.
# Put it in /etc/mosquitto/conf.d/edge.conf, make the two files below, and restart the broker.
# NOT YET ENCRYPTED: the password travels as plain text, so keep the listener on 127.0.0.1 until TLS is added (see docs/SECURITY.md).
listener 1883 127.0.0.1
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
