# A Mosquitto configuration with TLS, users and per-topic permissions (replaces mosquitto-secure.conf).
# Make the certificates with docs/make-certs.sh, put ca.crt, server.crt and server.key in /etc/mosquitto/certs/, and give the key to the
# broker only:  sudo chown root:mosquitto /etc/mosquitto/certs/server.key && sudo chmod 640 /etc/mosquitto/certs/server.key
# Put this file in /etc/mosquitto/conf.d/edge.conf and restart the broker. The bridge then needs --mqtt-port 8883 --mqtt-tls-ca <path to ca.crt>.
# This file does not restrict which TLS versions the broker accepts; the bridge refuses anything older than TLS 1.2 on its side.
listener 8883 127.0.0.1
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
