[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-mqtt-bridge"
version = "0.1.0"
description = "Reads the SparkFun Edge's microphone summary lines from a serial port and publishes them to an MQTT broker"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["paho-mqtt>=2.0", "pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
